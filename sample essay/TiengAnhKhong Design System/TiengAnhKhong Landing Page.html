  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"vi\"><head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>tienganhkhong — Học tiếng Anh có chủ đích<\u002Ftitle>\n  <style>/* TiengAnhKhong Design System — Global Stylesheet\n   Import this single file to get all tokens + base resets.\n   All rules live in imported files; no inline declarations here.\n*/\n\n/* TiengAnhKhong — Color Tokens\n   Two-color brand palette (cream + ink) extended into a warm gray scale.\n   All colors use a slightly warm (yellow-shifted) neutral base to stay\n   coherent with the brand's #FAF9F5 cream and #141413 near-black.\n*/\n\n:root {\n  /* ── Raw Scale ──────────────────────────────────────────────────── */\n  --gray-0:   #FFFFFF;\n  --gray-50:  #FAF9F5;   /* brand cream — primary surface */\n  --gray-100: #F2F0E9;\n  --gray-150: #EAE8DF;\n  --gray-200: #DEDAD0;\n  --gray-300: #C8C4B5;\n  --gray-400: #A9A494;\n  --gray-500: #857F70;\n  --gray-600: #5E5950;\n  --gray-700: #3A3630;\n  --gray-800: #242019;\n  --gray-900: #141413;   /* brand ink — primary text */\n\n  /* ── Semantic: Surfaces ─────────────────────────────────────────── */\n  --surface-base:       var(--gray-50);    /* page background */\n  --surface-raised:     var(--gray-0);     /* cards, modals */\n  --surface-sunken:     var(--gray-100);   /* inputs, code blocks */\n  --surface-overlay:    var(--gray-150);   /* hover states */\n  --surface-border:     var(--gray-200);   /* dividers, borders */\n  --surface-strong:     var(--gray-300);   /* stronger borders */\n\n  /* ── Semantic: Text ─────────────────────────────────────────────── */\n  --text-primary:   var(--gray-900);  /* headings, body */\n  --text-secondary: var(--gray-600);  /* captions, labels */\n  --text-tertiary:  var(--gray-500);  /* placeholders, hints */\n  --text-disabled:  var(--gray-400);\n  --text-inverse:   var(--gray-50);   /* on dark backgrounds */\n\n  /* ── Semantic: Interactive ──────────────────────────────────────── */\n  --interactive-default:  var(--gray-900);\n  --interactive-hover:    var(--gray-700);\n  --interactive-active:   var(--gray-800);\n  --interactive-disabled: var(--gray-300);\n  --interactive-focus:    var(--gray-900);\n\n  /* ── Score / Semantic Colors (muted, warm-toned) ─────────────────── */\n  /* Used for IELTS band score feedback — never garish */\n  --score-high:       #3D7A5B;   /* band 7–9: muted sage green */\n  --score-high-bg:    #EEF4F0;\n  --score-mid:        #8B6325;   /* band 5–6: warm amber */\n  --score-mid-bg:     #F7F1E6;\n  --score-low:        #8B3A35;   /* band 1–4: muted clay */\n  --score-low-bg:     #F5EDED;\n  --score-neutral:    var(--gray-600);\n  --score-neutral-bg: var(--gray-100);\n\n  /* ── Accent ─────────────────────────────────────────────────────── */\n  /* Warm clay — used sparingly for CTAs and interactive highlights */\n  --accent:        #C17040;\n  --accent-hover:  #A85D30;\n  --accent-bg:     #F8EDE4;\n\n  /* ── Product Card Surfaces ──────────────────────────────────────── */\n  /* Three pastel surfaces for featured-project / marketing cards.\n     Always pair with --text-primary (ink) for copy. Muted, warm,\n     never saturated — they extend the two-color brand into soft tints. */\n  --card-sage:   #8F9F7F;   /* writing — eucalyptus green */\n  --card-blush:  #EAD5CD;   /* speaking — warm blush */\n  --card-sand:   #ECE4CD;   /* vocabulary — warm sand */\n  --card-sage-tint:  #E7EDE0;  /* section pill / soft sage highlight */\n  --card-rule:   color-mix(in oklch, var(--gray-900) 16%, transparent);\n}\n\n/* TiengAnhKhong — Typography Tokens\n   Two-font system: Lora (editorial serif, display & pull quotes)\n   + DM Sans (clean sans, all UI + body copy).\n   JetBrains Mono for band scores, inline code, and tabular data.\n\n   NOTE: Lora is the nearest Google Fonts substitute for a Tiempos-style\n   editorial serif. If Tiempos Text files are provided, replace the\n   @font-face rules in fonts.css and : var(--tracking-snug);\n\n  --type-body-family: var(--font-sans);\n  --type-body-weight: var(--weight-regular);\n  --type-body-leading: var(--leading-relaxed);\n  --type-body-tracking: var(--tracking-normal);\n\n  --type-label-family: var(--font-sans);\n  --type-label-weight: var(--weight-medium);\n  --type-label-leading: var(--leading-tight);\n  --type-label-tracking: var(--tracking-wide);\n\n  --type-mono-family: var(--font-mono);\n  --type-mono-weight: var(--weight-regular);\n  --type-mono-leading: var(--leading-normal);\n}\n\n/* ── Google Fonts Import ─────────────────────────────────────────── */\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"44fd9089-f4a8-4bd8-bbfc-ab60ba484402\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"631fcf18-f1c7-4dde-a6dc-4c4c58e78219\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"84d6d244-0ae7-4579-8c57-84d8573a10f7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d59c3a52-782b-43a9-a3e2-b27025782cff\") form t('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7ffc0179-0418-4d43-810f-97df29536ab4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* TiengAnhKhong — Spacing, Radius & Motion Tokens\n   4px base unit. Scale is intentionally generous — the product\n   calls for \"quiet, focused workspace\" with ample whitespace.\n*/\n\n:root {\n  /* ── Spacing Scale ───────────────────────────────────────────────── */\n  --space-0:    0;\n  --space-1:    0.25rem;   /* 4px */\n  --space-2:    0.5rem;    /* 8px */\n  --space-3:    0.75rem;   /* 12px */\n  --space-4:    1rem;      /* 16px */\n  --space-5:    1.25rem;   /* 20px */\n  --space-6:    1.5rem;    /* 24px */\n  --space-8:    2rem;      /* 32px */\n  --space-10:   2.5rem;    /* 40px */\n  --space-12:   3rem;      /* 48px */\n  --space-16:   4rem;      /* 64px */\n  --space-20:   5rem;      /* 80px */\n  --space-24:   6rem;      /* 96px */\n  --space-32:   8rem;      /* 128px */\n\n  /* ── Semantic Spacing ────────────────────────────────────────────── */\n  --gap-xs:  var(--space-2);   /* 8px  — tight icon+label */\n  --gap-sm:  var(--space-3);   /* 12px — form field gap */\n  --gap-md:  var(--space-4);   /* 16px — standard gap */\n  --gap-lg:  var(--space-6);   /* 24px — section gap */\n  --gap-xl:  var(--space-8);   /* 32px — major section */\n  --gap-2xl: var(--space-12);  /* 48px — page sections */\n\n  --inset-xs: var(--space-2);  /* 8px  — dense padding */\n  --inset-sm: var(--space-3);  /* 12px — compact */\n  --inset-md: var(--space-4);  /* 16px — standard */\n  --inset-lg: var(--space-6);  /* 24px — comfortable */\n  --inset-xl: var(--space-8);  /* 32px — spacious */\n\n  /* ── Border Radius ───────────────────────────────────────────────── */\n  --radius-xs:   2px;\n  --radius-sm:   4px;\n  --radius-md:   8px;\n  --radius-lg:   12px;\n  --radius-xl:   16px;\n  --radius-full: 9999px;\n\n  /* ── Borders ─────────────────────────────────────────────────────── */\n  --border-width:     1px;\n  --border-width-md:  2px;\n  --border-style:     solid; /* @kind other */\n\n  /* ── Motion ──────────────────────────────────────────────────────── */\n  /* Flat design — transitions are subtle and brief */\n  --ease-default:  cubic-bezier(0.2, 0, 0, 1);   /* @kind other */\n  --ease-out:      cubic-bezier(0, 0, 0.3, 1); /* @kind other */\n  --ease-in-out:   cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n\n  --duration-fast:    80ms; /* @kind other */\n  --duration-default: 150ms; /* @kind other */\n  --duration-slow:    250ms; /* @kind other */\n\n  /* ── Shadows ─────────────────────────────────────────────────────── */\n  /* Flat design — almost no shadows. Only cards on white surfaces\n     get a very subtle 1px border instead of a box-shadow. */\n  --shadow-none:  none;\n  --shadow-xs:    0 1px 2px 0 oklch(7% 0.01 90 / 0.06);\n  --shadow-sm:    0 2px 6px 0 oklch(7% 0.01 90 / 0.08);\n\n  /* ── Z-index ─────────────────────────────────────────────────────── */\n  --z-base:    0; /* @kind other */\n  --z-raised:  10; /* @kind other */\n  --z-overlay: 100; /* @kind other */\n  --z-modal:   200; /* @kind other */\n  --z-toast:   300; /* @kind other */\n}\n\n/* TiengAnhKhong — Base Reset & Global Styles */\n\n*, *::before, *::after {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nhtml {\n  font-size: 16px;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  background-color: var(--surface-base);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  font-weight: var(--weight-regular);\n  line-height: var(--leading-relaxed);\n  letter-spacing: var(--tracking-normal);\n}\n\n/* ── Typography Base ─────────────────────────────────────────────── */\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--type-heading-family);\n  font-weight: var(--type-heading-weight);\n  line-height: var(--type-heading-leading);\n  letter-spacing: var(--type-heading-tracking);\n  color: var(--text-primary);\n  text-wrap: balance;\n}\n\nh1 { font-size: var(--text-3xl); }\nh2 { font-size: var(--text-2xl); }\nh3 { font-size: var(--text-xl); }\nh4 { font-size: var(--text-lg); }\nh5 { font-size: var(--text-base); }\nh6 { font-size: var(--text-sm); }\n\np {\n  color: var(--text-primary);\n  line-height: var(--leading-relaxed);\n  text-wrap: pretty;\n  max-width: 68ch;\n}\n\na {\n  color: inherit;\n  text-decoration: underline;\n  text-underline-offset: 3px;\n  text-decoration-color: var(--surface-strong);\n  transition: text-decoration-color var(--duration-default) var(--ease-default);\n}\n\na:hover {\n  text-decoration-color: var(--text-primary);\n}\n\ncode, kbd, pre {\n  font-family: var(--font-mono);\n  font-size: 0.9em;\n}\n\npre {\n  background: var(--surface-sunken);\n  border-radius: var(--radius-md);\n  padding: var(--inset-md);\n  overflow-x: auto;\n}\n\n/* ── Focus ───────────────────────────────────────────────────────── */\n:focus-visible {\n  outline: 2px solid var(--interactive-focus);\n  outline-offset: 2px;\n  border-radius: var(--radius-xs);\n}\n\n/* ── Utility ─────────────────────────────────────────────────────── */\n/* Spinner for Button loading state */\n@keyframes tak-spin {\n  to { transform: rotate(360deg); }\n}\n\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  border: 0;\n}\n\n<\u002Fstyle>\n  <script src=\"9d1b831e-e07b-40e5-bf98-a5e02dd9a904\"><\u002Fscript>\n  <style>\n    body { background: var(--surface-base); }\n\n    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }\n\n    /* ── Nav ──────────────────────────────────────────────────────── */\n    .nav {\n      display: flex; align-items: center; justify-content: space-between;\n      padding: 20px 0; gap: 24px;\n    }\n    .brand {\n      font-family: var(--font-sans); font-size: 19px; font-weight: 600;\n      letter-spacing: -0.02em; color: var(--text-primary); text-decoration: none;\n      display: inline-flex; align-items: center; gap: 11px;\n    }\n    .brand-mark {\n      width: 40px; height: 40px; border-radius: var(--radius-md);\n      background: var(--card-sage-tint); display: grid; place-items: center;\n      flex-shrink: 0;\n    }\n    .brand-mark img { width: 26px; height: 26px; object-fit: contain; }\n    .brand .dot { color: var(--card-sage); }\n    .nav-links {\n      display: flex; gap: 6px; list-style: none; margin: 0; padding: 5px;\n      background: var(--surface-sunken); border-radius: var(--radius-full);\n    }\n    .nav-links a {\n      font-family: var(--font-sans); font-size: 13px; font-weight: 500;\n      letter-spacing: 0.02em; color: var(--text-secondary); text-decoration: none;\n      padding: 8px 16px; border-radius: var(--radius-full);\n      transition: color var(--duration-default) var(--ease-default), background var(--duration-default) var(--ease-default);\n    }\n    .nav-links a:hover { color: var(--text-primary); background: var(--surface-raised); }\n    .nav-right { display: flex; align-items: center; gap: 18px; }\n    .nav-login {\n      font-family: var(--font-sans); font-size: 13px; font-weight: 500; letter-spacing: 0.02em;\n      color: var(--text-secondary); text-decoration: none;\n      transition: color var(--duration-default) var(--ease-default);\n    }\n    .nav-login:hover { color: var(--text-primary); }\n    .icon-btn {\n      width: 44px; height: 44px; border-radius: var(--radius-full);\n      border: 1px solid var(--surface-border); background: transparent;\n      display: grid; place-items: center; cursor: pointer; color: var(--text-primary);\n      transition: background var(--duration-default) var(--ease-default), border-color var(--duration-default) var(--ease-default);\n    }\n    .icon-btn:hover { background: var(--surface-overlay); border-color: var(--surface-strong); }\n    .icon-btn svg { width: 18px; height: 18px; }\n    .pill-btn {\n      font-family: var(--font-sans); font-size: 13px; font-weight: 500; letter-spacing: 0.04em;\n      background: var(--gray-900); color: var(--gray-50); border: 1px solid var(--gray-900);\n      border-radius: var(--radius-md); padding: 12px 24px; cursor: pointer; text-decoration: none;\n      display: inline-flex; align-items: center; gap: 8px;\n      transition: background var(--duration-default) var(--ease-default);\n    }\n    .pill-btn:hover { background: var(--gray-700); }\n\n    /* ── Hero ─────────────────────────────────────────────────────── */\n    .hero {\n      padding: 0 0 28px; text-align: center;\n      min-height: calc(100vh - 96px);\n      display: flex; flex-direction: column;\n    }\n    .hero-center { flex: 1; display: flex; flex-direction: column; justify-content: center; }\n    .trust { margin-top: 0; }\n    .hero-title {\n      font-family: var(--font-serif); font-weight: 500;\n      font-size: clamp(48px, 9.4vw, 138px); line-height: 0.96;\n      letter-spacing: -0.035em; color: var(--text-primary);\n      margin: 0; text-wrap: balance;\n    }\n    .hero-line {\n      display: flex; align-items: center; justify-content: center;\n      flex-wrap: wrap; gap: clamp(12px, 1.8vw, 28px);\n    }\n    .hero-pill {\n      display: inline-flex; align-items: center; justify-content: center;\n      height: clamp(56px, 7.6vw, 112px); width: clamp(108px, 16vw, 232px);\n      background: var(--card-sand); border-radius: var(--radius-full);\n      overflow: hidden; flex-shrink: 0;\n    }\n    .hero-pill img { width: 78%; height: 78%; object-fit: contain; }\n\n    .hero-actions {\n      display: flex; align-items: center; justify-content: center; gap: 20px;\n      margin-top: clamp(32px, 4vw, 52px);\n    }\n    .cta-primary {\n      font-family: var(--font-sans); font-size: 14px; font-weight: 500; letter-spacing: 0.06em;\n      text-transform: uppercase; background: var(--gray-900); color: var(--gray-50);\n      border: none; border-radius: var(--radius-md); padding: 16px 36px; cursor: pointer;\n      text-decoration: none; display: inline-flex; align-items: center;\n      transition: background var(--duration-default) var(--ease-default);\n    }\n    .cta-primary:hover { background: var(--gray-700); }\n    .cta-ghost {\n      font-family: var(--font-sans); font-size: 13px; font-weight: 500; letter-spacing: 0.08em;\n      text-transform: uppercase; color: var(--text-primary); text-decoration: none;\n      display: inline-flex; align-items: center; gap: 14px;\n    }\n    .cta-ghost .circ {\n      width: 48px; height: 48px; border-radius: var(--radius-full);\n      border: 1px solid var(--surface-strong); display: grid; place-items: center;\n      transition: background var(--duration-default) var(--ease-default);\n    }\n    .cta-ghost:hover .circ { background: var(--surface-overlay); }\n    .cta-ghost svg { width: 16px; height: 16px; }\n\n    /* ── Trust / explore bar ─────────────────────────────────────── */\n    .trust {\n      margin-top: 0;\n      border-top: 1px solid var(--surface-border);\n      display: flex; align-items: center; justify-content: space-between;\n      padding: 22px 0 8px; gap: 24px; flex-wrap: wrap;\n    }\n    .trust-label {\n      display: inline-flex; align-items: center; gap: 12px;\n      font-family: var(--font-sans); font-size: 11px; font-weight: 600;\n      letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary);\n    }\n    .trust-label .sq {\n      width: 36px; height: 36px; border-radius: var(--radius-md);\n      border: 1px solid var(--surface-border); display: grid; place-items: center;\n    }\n    .trust-label .sq svg { width: 16px; height: 16px; color: var(--text-secondary); }\n    .trust-mid { display: flex; gap: 36px; }\n    .trust-mid span {\n      font-family: var(--font-serif); font-size: 17px; color: var(--text-secondary);\n    }\n    .trust-mid .sep { color: var(--surface-strong); }\n\n    /* ── Section: featured projects ──────────────────────────────── */\n    .section { background: var(--surface-raised); margin-top: 64px; padding: clamp(64px, 9vw, 128px) 0; }\n    .section-head { text-align: center; max-width: 760px; margin: 0 auto clamp(48px, 6vw, 80px); }\n    .eyebrow {\n      display: inline-block; font-family: var(--font-sans); font-size: 12px; font-weight: 500;\n      letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary);\n      background: var(--card-sage-tint); padding: 6px 14px; border-radius: var(--radius-full);\n      margin-bottom: 28px;\n    }\n    .section-head h2 {\n      font-family: var(--font-serif); font-weight: 500;\n      font-size: clamp(32px, 4.4vw, 56px); line-height: 1.08; letter-spacing: -0.025em;\n      color: var(--text-primary); margin: 0;\n    }\n    .learn-more {\n      display: inline-flex; align-items: center; gap: 14px; margin-top: 32px;\n      font-family: var(--font-sans); font-size: 12px; font-weight: 600; letter-spacing: 0.1em;\n      text-transform: uppercase; color: var(--text-primary); text-decoration: none;\n    }\n    .learn-more .circ {\n      width: 44px; height: 44px; border-radius: var(--radius-full);\n      border: 1px solid var(--surface-strong); display: grid; place-items: center;\n      transition: background var(--duration-default) var(--ease-default);\n    }\n    .learn-more:hover .circ { background: var(--surface-overlay); }\n    .learn-more svg { width: 15px; height: 15px; }\n\n    /* ── Project cards ───────────────────────────────────────────── */\n    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }\n    .card {\n      border-radius: 22px; padding: 40px 36px 36px;\n      display: flex; flex-direction: column; min-height: 580px;\n      color: var(--text-primary);\n    }\n    .card.sage  { background: var(--card-sage); }\n    .card.blush { background: var(--card-blush); }\n    .card.sand  { background: var(--card-sand); }\n\n    .card-il { width: 92px; height: 92px; object-fit: contain; margin-bottom: 28px; }\n    .card-badge {\n      align-self: flex-start; font-family: var(--font-sans); font-size: 11px; font-weight: 600;\n      letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 12px;\n      border-radius: var(--radius-sm); margin-bottom: 24px;\n    }\n    .card-badge.dark { background: var(--gray-900); color: var(--gray-50); }\n    .card-badge.gold { background: var(--score-mid); color: var(--gray-50); }\n    .card-label {\n      font-family: var(--font-mono); font-size: 12px; font-weight: 500;\n      letter-spacing: 0.1em; text-transform: uppercase;\n      color: color-mix(in oklch, var(--gray-900) 50%, transparent); margin-bottom: 18px;\n    }\n    .card-rule { border: none; border-top: 1px solid var(--card-rule); margin: 0 0 22px; }\n    .card-title {\n      font-family: var(--font-sans); font-weight: 600; font-size: 25px;\n      letter-spacing: -0.015em; line-height: 1.25; margin: 0 0 18px;\n    }\n    .card-body {\n      font-family: var(--font-serif); font-size: 16px; line-height: 1.62;\n      color: color-mix(in oklch, var(--gray-900) 86%, transparent); margin: 0;\n      max-width: none;\n    }\n    .card-body strong { font-weight: 600; color: var(--text-primary); }\n    .card-body + .card-body { margin-top: 10px; }\n    .card-grow { flex: 1; }\n    .card-cta {\n      display: inline-flex; align-items: center; gap: 10px; text-decoration: none;\n      font-family: var(--font-sans); font-size: 15px; font-weight: 600;\n      color: var(--text-primary); margin-top: 22px;\n    }\n    .card-cta svg {\n      width: 17px; height: 17px;\n      transition: transform var(--duration-default) var(--ease-default);\n    }\n    .card-cta:hover svg { transform: translateX(4px); }\n\n    /* ── Footer ──────────────────────────────────────────────────── */\n    .footer {\n      display: flex; align-items: center; justify-content: space-between;\n      padding: 36px 0; flex-wrap: wrap; gap: 16px;\n    }\n    .footer .brand { font-size: 18px; }\n    .footer span {\n      font-family: var(--font-sans); font-size: 12px; color: var(--text-tertiary);\n    }\n\n    @media (max-width: 900px) {\n      .cards { grid-template-columns: 1fr; }\n      .nav-links { display: none; }\n      .trust-mid { display: none; }\n    }\n  <\u002Fstyle>\n<\u002Fhead>\n<body>\n  <header class=\"wrap\">\n    <nav class=\"nav\">\n      <a class=\"brand\" href=\"#\">tienhanhkhong.<\u002Fa>\n      <ul class=\"nav-links\">\n        <li><a href=\"#\">Sản phẩm<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Về chúng mình<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Blog<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Liên hệ<\u002Fa><\u002Fli>\n      <\u002Ful>\n      <div class=\"nav-right\">\n        <a class=\"nav-login\" href=\"#\">Đăng nhập<\u002Fa>\n        <a class=\"pill-btn\" href=\"#\">Đăng Ký<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <main>\n    <section class=\"wrap hero\">\n      <div class=\"hero-center\">\n      <h1 class=\"hero-title\">\n        <span class=\"hero-line\">\n          <span>Học<\u002Fspan>\n          <span class=\"hero-pill\"><img src=\"e2f75611-94ea-44f1-b664-92124615734c\" alt=\"\"><\u002Fspan>\n          <span>tiếng Anh<\u002Fspan>\n        <\u002Fspan>\n        <span class=\"hero-line\">không dùng được thì để làm gì?<\u002Fspan>\n      <\u002Fh1>\n\n      <div class=\"hero-actions\">\n        <a class=\"cta-primary\" href=\"#\">Bắt đầu viết<\u002Fa>\n        <a class=\"cta-ghost\" href=\"#\">\n          Xem cách hoạt động\n        <\u002Fa>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"section\">\n      <div class=\"wrap\">\n        <div class=\"section-head\">\n          <span class=\"eyebrow\">Sản phẩm<\u002Fspan>\n          <h2>Chúng mình có 3 dự án nhưng cùng 1 mục tiêu<\u002Fh2>\n          <a class=\"learn-more\" href=\"#\">SỬ DỤNG ĐƯỢC TIẾNG ANH<\u002Fa>\n        <\u002Fdiv>\n\n        <div class=\"cards\">\n          <article class=\"card sage\">\n            <img class=\"card-il\" src=\"05358da1-799a-4dc8-8c58-7a399d0f035e\" alt=\"\">\n            <span class=\"card-badge dark\">ĐANG PHÁT TRIỂN<\u002Fspan>\n            <div class=\"card-label\">Writing Skills Builder<\u002Fdiv>\n            <hr class=\"card-rule\">\n            <h3 class=\"card-title\">Trình rèn kỹ năng Viết<\u002Fh3>\n            <p class=\"card-body\">Nôm na là: các bạn có thể luyện lập luận, luyện cách sắp xếp ý <strong>CÓ CHỦ ĐÍCH<\u002Fstrong>, và of course là luyện thêm cách diễn đạt.<\u002Fp>\n            <p class=\"card-body\"><strong>VÀ QUAN TRỌNG NHẤT<\u002Fstrong>: sẽ có nhận xét dưới các kiến thức về ngôn ngữ học để có cái nhìn chính xác nhất.<\u002Fp>\n            <div class=\"card-grow\"><\u002Fdiv>\n            <hr class=\"card-rule\">\n            <a class=\"card-cta\" href=\"#\">Dùng thử beta <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n          <\u002Farticle>\n\n          <article class=\"card blush\">\n            <img class=\"card-il\" src=\"b94ee3e4-68fb-45b5-aef5-63358e21f8af\" alt=\"\">\n            <span class=\"card-badge dark\">Đang phát triển<\u002Fspan>\n            <div class=\"card-label\">Speaking Skills Builder<\u002Fdiv>\n            <hr class=\"card-rule\">\n            <h3 class=\"card-title\">Trình rèn kỹ năng Nói<\u002Fh3>\n            <p class=\"card-body\">Tương tự vậy: luyện tone giọng, luyện nhịp khi nói, luyện phát âm, luyện phản xạ,....<\u002Fp>\n            <p class=\"card-body\">Và cũng tương tự: sẽ luôn có nhận xét về mặt ngôn ngữ học cũng như bài tập để luyện các kỹ năng \"tưởng chừng\" khó này :)<\u002Fp>\n            <div class=\"card-grow\"><\u002Fdiv>\n            <hr class=\"card-rule\">\n            <a class=\"card-cta\" href=\"#\">Tìm hiểu thêm <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n          <\u002Farticle>\n\n          <article class=\"card sand\">\n            <img class=\"card-il\" src=\"0bec2147-92d2-4b02-974f-52be0f8950c5\" alt=\"\">\n            <span class=\"card-badge gold\">Sắp ra mắt<\u002Fspan>\n            <div class=\"card-label\">Vocabulary Builder<\u002Fdiv>\n            <hr class=\"card-rule\">\n            <h3 class=\"card-title\">Trình xây vốn từ<\u002Fh3>\n            <p class=\"card-body\">Chúng ta đã đi từ học theo list từ vựng, tới học qua flashcards rồi các bài tập như nghe-điền, fill-in-the-blank,....<\u002Fp>\n            <p class=\"card-body\"><strong>NHƯNG MỘT VẤN ĐỀ<\u002Fstrong> vẫn luôn còn ở đó, liệu những bài tập này có giúp chúng ta <strong>SỬ DỤNG ĐƯỢC<\u002Fstrong> những từ chúng ta đã học không?<\u002Fp>\n            <div class=\"card-grow\"><\u002Fdiv>\n            <hr class=\"card-rule\">\n            <a class=\"card-cta\" href=\"#\">Đăng ký nhận tin <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n          <\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer class=\"wrap footer\">\n      <a class=\"brand\" href=\"#\"><span>tienganhkhong<span class=\"dot\">.<\u002Fspan><\u002Fspan><\u002Fa>\n      <span>© 2026 tienganhkhong — Học tiếng Anh có chủ đích.<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fmain>\n\n  \n  <script>lucide.createIcons();<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
