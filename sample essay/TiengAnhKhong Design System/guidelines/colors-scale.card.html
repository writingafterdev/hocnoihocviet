<!-- @dsCard group="Colors" viewport="700x100" name="Warm Gray Scale" subtitle="Full 9-step warm neutral ramp between cream and ink" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; padding: 16px 24px; display: flex; gap: 4px; align-items: stretch; }
    .step { flex: 1; border-radius: var(--radius-xs); display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; min-height: 68px; }
    .label { font-family: var(--font-mono); font-size: 9px; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="step" style="background:#FFFFFF; border:1px solid #DEDAD0;"><span class="label" style="color:#5E5950">0</span></div>
  <div class="step" style="background:#FAF9F5; border:1px solid #DEDAD0;"><span class="label" style="color:#5E5950">50</span></div>
  <div class="step" style="background:#F2F0E9;"><span class="label" style="color:#5E5950">100</span></div>
  <div class="step" style="background:#EAE8DF;"><span class="label" style="color:#5E5950">150</span></div>
  <div class="step" style="background:#DEDAD0;"><span class="label" style="color:#5E5950">200</span></div>
  <div class="step" style="background:#C8C4B5;"><span class="label" style="color:#3A3630">300</span></div>
  <div class="step" style="background:#A9A494;"><span class="label" style="color:#3A3630">400</span></div>
  <div class="step" style="background:#857F70;"><span class="label" style="color:#FAF9F5">500</span></div>
  <div class="step" style="background:#5E5950;"><span class="label" style="color:#FAF9F5">600</span></div>
  <div class="step" style="background:#3A3630;"><span class="label" style="color:#FAF9F5">700</span></div>
  <div class="step" style="background:#242019;"><span class="label" style="color:#FAF9F5">800</span></div>
  <div class="step" style="background:#141413;"><span class="label" style="color:#FAF9F5">900</span></div>
</body>
</html>
