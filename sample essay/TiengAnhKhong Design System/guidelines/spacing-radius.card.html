<!-- @dsCard group="Spacing" viewport="700x110" name="Border Radius" subtitle="Corner rounding from sharp (2px) to pill (9999px)" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--surface-base); margin: 0; padding: 20px 24px; display: flex; gap: 16px; align-items: center; }
    .box { width: 64px; height: 64px; background: var(--gray-900); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .lbl { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); margin-top: 6px; text-align: center; }
    .wrap { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <div class="wrap"><div class="box" style="border-radius:2px"></div><div class="lbl">xs·2px</div></div>
  <div class="wrap"><div class="box" style="border-radius:4px"></div><div class="lbl">sm·4px</div></div>
  <div class="wrap"><div class="box" style="border-radius:8px"></div><div class="lbl">md·8px</div></div>
  <div class="wrap"><div class="box" style="border-radius:12px"></div><div class="lbl">lg·12px</div></div>
  <div class="wrap"><div class="box" style="border-radius:16px"></div><div class="lbl">xl·16px</div></div>
  <div class="wrap"><div class="box" style="border-radius:9999px; width:80px; height:40px"></div><div class="lbl">full·9999</div></div>
</body>
</html>
