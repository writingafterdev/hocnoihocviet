<!-- @dsCard group="Spacing" viewport="700x130" name="Spacing Scale" subtitle="4px base unit — space-1 through space-16" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--surface-base); margin: 0; padding: 20px 24px; display: flex; gap: 12px; align-items: flex-end; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .bar { background: var(--gray-900); border-radius: 2px; width: 28px; }
    .label { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="step"><div class="bar" style="height:4px"></div><div class="label">1·4px</div></div>
  <div class="step"><div class="bar" style="height:8px"></div><div class="label">2·8px</div></div>
  <div class="step"><div class="bar" style="height:12px"></div><div class="label">3·12px</div></div>
  <div class="step"><div class="bar" style="height:16px"></div><div class="label">4·16px</div></div>
  <div class="step"><div class="bar" style="height:20px"></div><div class="label">5·20px</div></div>
  <div class="step"><div class="bar" style="height:24px"></div><div class="label">6·24px</div></div>
  <div class="step"><div class="bar" style="height:32px"></div><div class="label">8·32px</div></div>
  <div class="step"><div class="bar" style="height:40px"></div><div class="label">10·40px</div></div>
  <div class="step"><div class="bar" style="height:48px"></div><div class="label">12·48px</div></div>
  <div class="step"><div class="bar" style="height:64px"></div><div class="label">16·64px</div></div>
  <div class="step"><div class="bar" style="height:80px"></div><div class="label">20·80px</div></div>
</body>
</html>
