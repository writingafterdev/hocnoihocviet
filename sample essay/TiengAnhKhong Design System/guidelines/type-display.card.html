<!-- @dsCard group="Type" viewport="700x200" name="Display Type" subtitle="Lora serif — used for display headings and editorial pull quotes" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--surface-base); margin: 0; padding: 24px; }
    .d1 { font-family: var(--font-serif); font-size: 48px; font-weight: 500; line-height: 1.15; letter-spacing: -0.02em; color: var(--text-primary); }
    .d2 { font-family: var(--font-serif); font-size: 32px; font-weight: 400; line-height: 1.25; letter-spacing: -0.01em; color: var(--text-primary); margin-top: 8px; }
    .d3 { font-family: var(--font-serif); font-size: 20px; font-weight: 400; font-style: italic; color: var(--text-secondary); margin-top: 6px; }
    .meta { font-family: var(--font-sans); font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="meta">Lora · Serif · Display</div>
  <div class="d1">Your writing, clearly understood.</div>
  <div class="d2">Structured feedback for IELTS Task 2</div>
  <div class="d3">Honest assessment. Intelligent insight. No noise.</div>
</body>
</html>
